<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>选中浮条</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      background: transparent;
      font: 13px/1.4 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    #bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #1e1f24;
      color: #e8eaed;
      border: 1px solid #3c3f46;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      width: max-content;
      max-width: 420px;
    }
    button {
      border: 0;
      border-radius: 7px;
      padding: 6px 10px;
      background: #2c2e34;
      color: inherit;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    button:hover { background: #3a3d46; }
    button.primary { background: #4f7cff; color: #fff; }
    button.primary:hover { background: #6b91ff; }
    button.ghost { background: transparent; opacity: .85; }
    #hint {
      display: none;
      max-width: 240px;
      font-size: 11px;
      opacity: .75;
      padding: 0 4px;
    }
    #status {
      display: none;
      max-width: 220px;
      font-size: 12px;
      padding: 0 4px;
    }
    #menu { display: none; position: absolute; }
    .spinner { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -2px; margin-right: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="bar">
    <button id="btn-optimize" class="primary" title="补全角色/约束/输出格式">✨ 优化提示词</button>
    <button id="btn-structure" title="只整理断句编号，不补要素">≡ 结构化整理</button>
    <button id="btn-more" class="ghost" title="更多">⋯</button>
    <button id="btn-close" class="ghost" title="关闭（不处理）">×</button>
    <div id="hint"></div>
    <div id="status"></div>
    <div id="more-menu">
      <button id="btn-copy-raw" class="ghost">复制原文</button>
      <button id="btn-open-app" class="ghost">打开 Voice2Prompt</button>
      <button id="btn-feedback" class="ghost">反馈</button>
    </div>
  </div>
  <script src="palette.js"></script>
</body>
</html>
